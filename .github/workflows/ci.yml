# ============================================================
# ci.yml —— NixOS 配置 CI（STANDARDS.md §7）
# 触发：push 到 main + 所有 PR
# 检查：git diff --check（空白错误门禁，第 1 步）
#        + nix flake check（treefmt/statix/deadnix/pre-commit 全量）
#        + nix fmt -- --fail-on-change（RFC 风格格式化门禁）
# 说明：2026-08-29 私有包（fcclient/tomatodo）已移出仓库 → 无 path 输入，
#       无需 override-input 占位，本机/CI 求值完全一致。
# 不引入外部服务；仅官方/社区维护 action。
# ============================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 第 1 步（不依赖 Nix）：空白错误门禁
      # 2026-08-21 教训：尾随空格曾漏进 home/modules/tools/ai.nix，
      # nix fmt 虽能改写但 git 层面先拦截更省事（STANDARDS §7 第 3 步）
      - name: Whitespace check
        run: git diff --check

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v9

      # 标准修改流程质量门禁（STANDARDS §10）：flake check 全绿
      # 注：2026-08-29 起无仓库外 path 输入（fcclient/tomatodo 已移出），无需 override-input
      - name: Nix flake check
        run: nix flake check

      # 格式化门禁（STANDARDS §7）：RFC 风格，nix fmt 统一入口
      # 注：treefmt 的 check 语义是 --fail-on-change（无 --check flag）
      - name: Nix fmt check
        run: nix fmt -- --fail-on-change
