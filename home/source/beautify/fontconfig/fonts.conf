<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

    <!-- 全局抗锯齿 + 微调 -->
    <match target="font">
        <edit name="antialias" mode="assign"><bool>true</bool></edit>
        <edit name="hinting" mode="assign"><bool>true</bool></edit>
        <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
        <edit name="rgba" mode="assign"><const>rgb</const></edit>
        <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
    </match>

    <!-- 拉丁字体族 -->
    <alias>
        <family>sans-serif</family>
        <prefer>
            <family>Noto Sans</family>
            <family>Adwaita Sans</family>
            <family>Liberation Sans</family>
            <family>Noto Sans CJK SC</family>
        </prefer>
    </alias>

    <alias>
        <family>serif</family>
        <prefer>
            <family>Noto Serif</family>
            <family>Adwaita Serif</family>
            <family>Liberation Serif</family>
            <family>Noto Serif CJK SC</family>
        </prefer>
    </alias>

    <alias>
        <family>monospace</family>
        <prefer>
            <family>JetBrainsMono Nerd Font</family>
            <family>Noto Sans Mono</family>
            <family>Adwaita Mono</family>
        </prefer>
    </alias>

    <!-- 中文回退兜底（Noto Sans CJK SC，与浏览器 UI 字体一致） -->
    <match target="pattern">
        <test name="lang" compare="contains">
            <string>zh</string>
        </test>
        <edit name="family" mode="prepend" binding="strong">
            <string>Noto Sans CJK SC</string>
        </edit>
    </match>

    <!-- 屏蔽不和谐的 CJK 字体（宋体/仿宋/等线/新宋体，仅作 sans 回退时排除） -->
    <selectfont>
        <rejectfont>
            <pattern>
                <patelt name="family">
                    <string>SimSun</string>
                    <string>NSimSun</string>
                    <string>FangSong</string>
                    <string>STFangsong</string>
                    <string>DengXian</string>
                    <string>KaiTi</string>
                    <string>STKaiti</string>
                    <string>Songti SC</string>
                    <string>WenQuanYi Micro Hei</string>
                </patelt>
            </pattern>
        </rejectfont>
    </selectfont>

</fontconfig>
